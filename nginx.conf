server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://qwen.rangeltech.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  location / {
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' https://api.github.com https://qwen.rangeltech.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Cache-Control "no-cache";  # paginas revalidam sempre (add_header de location substitui o do server, por isso os de seguranca se repetem)
    try_files $uri $uri/index.html $uri/ =404;
  }
  location /assets/ { add_header Cache-Control "no-cache"; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }  # revalida sempre (ETag): config.js e style.css mudam e o navegador nao pode ficar com copia velha
  error_page 404 /404.html;
  location = /health { return 200 "ok"; add_header Content-Type text/plain; }
}
