name: Release
# Publica a imagem do site + release-manifest. NAO faz deploy (so o vps_rt_infra implanta).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versao (ex.: v0.1.0)"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Versao
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then V="${{ inputs.version }}"; else V="${GITHUB_REF_NAME}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build da imagem e teste de saude
        run: |
          V="${{ steps.v.outputs.version }}"
          docker build -t "brain-site:${V}" .
          cid=$(docker run -d --rm -p 18080:8080 "brain-site:${V}")
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:18080/health >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/health && curl -fsS http://127.0.0.1:18080/ | grep -q "Segundo Cérebro"
          docker stop "$cid" >/dev/null
          docker save "brain-site:${V}" | gzip -9 > image.tar.gz
          echo "IMAGE_ID=sha256:$(gunzip -c image.tar.gz | tar -xO manifest.json | python3 -c "import sys,json,re;print(re.sub(r'^.*/','',json.load(sys.stdin)[0]['Config']).replace('.json',''))")" >> "$GITHUB_ENV"
          echo "ARCHIVE_SHA=$(sha256sum image.tar.gz | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Manifesto
        run: |
          python3 - <<'PY'
          import json, os, datetime
          v = "${{ steps.v.outputs.version }}"
          m = {"schema": 1, "service": "brain-site", "repo": "RangelTech/segundo_cerebro_site", "commit": os.environ["GITHUB_SHA"][:7], "version": v,
               "artifact": {"type": "docker-archive", "asset": "image.tar.gz", "sha256": os.environ["ARCHIVE_SHA"], "image_id": os.environ["IMAGE_ID"], "tag": "brain-site:" + v},
               "built_at": datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"),
               "healthcheck": {"path": "/health", "expect": 200, "timeout_s": 60, "port": 8080},
               "env": {"required": []}, "resources": {"memory": "64m", "cpus": "0.25"}}
          json.dump(m, open("release-manifest.json", "w"), indent=2)
          PY
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "$V" release-manifest.json image.tar.gz --title "$V" --notes "Artefato docker-archive. Deploy: somente vps_rt_infra." --target "${GITHUB_SHA}" || gh release upload "$V" release-manifest.json image.tar.gz --clobber
